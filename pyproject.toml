[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessdiff"
version = "0.1.0"
description = "A lab that shows exactly what each agent harness layer fixes"
authors = [{name = "HarnessDiff Contributors"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.scripts]
harnessdiff = "harnessdiff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessdiff*", "tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
