[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harnessdiff"
version = "1.0.0"
description = "A lab that shows exactly what each agent harness layer fixes"
authors = [{name = "Nagaraju Poralla", email = "porallanagaraju13@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["agent", "harness", "ai", "llm", "ablation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://github.com/Porallanagaraju13/Harness"
Repository = "https://github.com/Porallanagaraju13/Harness"
Documentation = "https://github.com/Porallanagaraju13/Harness#readme"
Demo = "https://harnessdiff.vercel.app"
Issues = "https://github.com/Porallanagaraju13/Harness/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
]
llm = [
    "openai>=1.0",
    "anthropic>=0.20",
]

[project.scripts]
harnessdiff = "harnessdiff.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harnessdiff*", "tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["web", "results", "dist", "build", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
